    /* 首頁照片輪播 */

  position: relative;

.carousel-track {
  display: flex;

  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 下方切換圓點 */
.carousel-dots {
  position: absolute;
  bottom: 8px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 6px;
}

.carousel-dots .dot {
  width: 4px;
  height: 4px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.65);
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}

.carousel-dots .dot.active {
  background: #ffffff;
  transform: scale(1.25);
}

  <script>
    
const songList = document.getElementById("songList");

[...songList.querySelectorAll(".song")]
  .reverse()
  .forEach((song) => songList.appendChild(song));

    const search = document.getElementById("search");
    const songs = document.querySelectorAll(".song");
    
let activeView = "home";

const homeTab = document.getElementById("homeTab");
const favoritesTab = document.getElementById("favoritesTab");

function applySongFilter() {
  const keyword = search.value.trim().toLowerCase();

  songs.forEach((song) => {
    const name = song.dataset.song.toLowerCase();
    const matchesSearch = name.includes(keyword);
    const isFavorite = favoriteSongs.has(song.dataset.song);

    song.hidden =
      !matchesSearch ||
      (activeView === "favorites" && !isFavorite);
  });
}

function switchView(view) {
  activeView = view;

  homeTab.classList.toggle("active", view === "home");
  favoritesTab.classList.toggle("active", view === "favorites");

  applySongFilter();
}

homeTab.addEventListener("click", () => switchView("home"));
favoritesTab.addEventListener("click", () => switchView("favorites"));

    console.log("搜尋功能已載入", search, songs.length);
    
const favoriteSongs = new Set(
  JSON.parse(localStorage.getItem("favoriteSongs") || "[]")
);

songs.forEach((song) => {
  const star = document.createElement("span");
  star.className = "favorite-star";
  function updateStar() {
  const active = favoriteSongs.has(song.dataset.song);

  star.innerHTML = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 3.5
           L14.7 8.9
           L20.7 9.8
           L16.4 14
           L17.4 20
           L12 17.1
           L6.6 20
           L7.6 14
           L3.3 9.8
           L9.3 8.9 Z"
        fill="${active ? "currentColor" : "none"}"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    </svg>
  `;
}
updateStar();
  star.classList.toggle(
    "is-favorite",
    favoriteSongs.has(song.dataset.song)
  );
  applySongFilter();
  star.setAttribute("role", "button");
  star.setAttribute("tabindex", "0");
  star.setAttribute("aria-label", "收藏歌曲");

  function toggleFavorite(event) {
    event.preventDefault();
    event.stopPropagation();

    const name = song.dataset.song;

    if (favoriteSongs.has(name)) {
      favoriteSongs.delete(name);
    } else {
      favoriteSongs.add(name);
    }

    localStorage.setItem(
      "favoriteSongs",
      JSON.stringify([...favoriteSongs])
    );

    updateStar();
    star.classList.toggle("is-favorite", favoriteSongs.has(name));
    applySongFilter();
  }

  star.addEventListener("click", toggleFavorite);

  star.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      toggleFavorite(event);
    }
  });

  song.appendChild(star);
});

search.addEventListener("input", applySongFilter);


    songs.forEach((song) => {
      song.addEventListener("click", () => {
        const songName = song.dataset.song;
    sessionStorage.setItem("songListScrollY", window.scrollY);
    window.location.href =
      "practice.html?song=" + encodeURIComponent(songName);
      });
    });

    
// 首頁照片輪播：自動播放、圓點切換、觸控滑動與滑鼠拖曳
document.querySelectorAll(".carousel-track img").forEach((img, index) => {
  img.addEventListener("click", () => {
    console.log("點到第幾張照片：", index + 1);
  });
});
const carouselTrack = document.querySelector(".carousel-track");
const carouselDots = document.querySelectorAll(".carousel-dots .dot");
const heroCarousel = document.querySelector(".hero-carousel");
let wasSwiping = false;
let carouselStartX = 0;
let carouselStartY = 0;
let gestureMoved = false;

if (carouselTrack && heroCarousel) {
  const originalSlides = Array.from(
    carouselTrack.querySelectorAll("img")
  );
  const totalSlides = originalSlides.length;

  if (totalSlides > 0) {
    let currentSlide = 1;
    let carouselTimer = null;
    let isTransitioning = false;
    let startX = 0;
    let startY = 0;
    let isDragging = false;

    // 複製最後一張與第一張，實現雙向無縫循環
const lastClone = originalSlides[totalSlides - 1].cloneNode(true);
lastClone.draggable = false;
carouselTrack.insertBefore(lastClone, originalSlides[0]);

const firstClone = originalSlides[0].cloneNode(true);
firstClone.draggable = false;
carouselTrack.appendChild(firstClone);

carouselTrack.querySelectorAll("img").forEach((img) => {
  img.draggable = false;
});

// 起始位置跳過最前面的最後一張複製圖
carouselTrack.style.transition = "none";
carouselTrack.style.transform = "translateX(-100%)";

    heroCarousel.style.touchAction = "pan-y";
    function updateDots(index) {
  const dotIndex = index === 0
    ? totalSlides - 1
    : index === totalSlides + 1
      ? 0
      : index - 1;

  carouselDots.forEach((dot, i) => {
    dot.classList.toggle("active", i === dotIndex);
  });
}

    function moveToSlide(index, animate = true) {
      carouselTrack.style.transition = animate
        ? "transform 0.6s ease"
        : "none";

      carouselTrack.style.transform =
        `translateX(-${index * 100}%)`;
    }

    function showSlide(index) {
      if (isTransitioning) return;

      // 確保索引在合法範圍內：包含最後的複製圖片
      if (index < 0 || index > totalSlides + 1) return;

      isTransitioning = true;
      currentSlide = index;

      moveToSlide(currentSlide, true);
      updateDots(currentSlide);
    }

    carouselTrack.addEventListener("transitionend", (event) => {
      if (event.propertyName !== "transform") return;

      // 到達複製的第一張後，瞬間回到真正的第一張
if (currentSlide === totalSlides + 1) {
  currentSlide = 1;
  moveToSlide(1, false);
}

// 到達複製的最後一張後，瞬間回到真正的最後一張
if (currentSlide === 0) {
  currentSlide = totalSlides;
  moveToSlide(totalSlides, false);
}

isTransitioning = false;
updateDots(currentSlide);

      isTransitioning = false;
    });

    function startCarousel() {
      clearInterval(carouselTimer);

      carouselTimer = setInterval(() => {
        if (!isTransitioning) {
          showSlide(currentSlide + 1);
        }
      }, 4000);
    }

    // 觸控滑動與滑鼠拖曳
    heroCarousel.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) {
        return;
      }

      startX = event.clientX;
startY = event.clientY;
carouselStartX = event.clientX;
carouselStartY = event.clientY;
isDragging = true;
gestureMoved = false;
wasSwiping = false;

  
    });

    heroCarousel.addEventListener("pointermove", (event) => {
  if (!isDragging) return;

  const deltaX = event.clientX - startX;
  const deltaY = event.clientY - startY;
  if (Math.abs(deltaX) >= 10 || Math.abs(deltaY) >= 10) {
  gestureMoved = true;
}

  if (
    Math.abs(deltaX) > 8 ||
    Math.abs(deltaY) > 8
  ) {
    gestureMoved = true;
  }
});

    heroCarousel.addEventListener("pointerup", (event) => {
      if (!isDragging) return;
      isDragging = false;

      const deltaX = event.clientX - startX;
      const deltaY = event.clientY - startY;
      wasSwiping =
  Math.abs(deltaX) >= 10 ||
  Math.abs(deltaY) >= 10;

if (wasSwiping) {
  gestureMoved = true;

  setTimeout(() => {
    gestureMoved = false;
    wasSwiping = false;
  }, 700);
}

  // 讓左右滑動更靈敏
if (
  Math.abs(deltaX) < 25 ||
  Math.abs(deltaX) < Math.abs(deltaY) * 1.1
) {
  return;
}

      if (isTransitioning) return;

      if (deltaX < 0) {
  // 往左：下一張（包含最後一張循環回第一張）
  showSlide(currentSlide + 1);
} else {
  // 往右：上一張（包含第一張循環回最後一張）
  showSlide(currentSlide - 1);
}

      startCarousel();
    });

    heroCarousel.addEventListener("pointercancel", () => {
      isDragging = false;
    });

    startCarousel();
  }
}
