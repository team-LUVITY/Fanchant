function renderLyrics() {
  lyricsBox.innerHTML = "";

  // 將中文切分出來，單獨套用中文字型
  function appendLyricText(line, text, color) {
    const chunks = text.split(
      /([\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]+)/g
    ).filter(Boolean);

    chunks.forEach((chunk) => {
      const span = document.createElement("span");
      span.textContent = chunk;
      span.dataset.color = color || "#3888e8";
      span.style.color = "#aaa3bd";

      // 只有中文字套用中文專用字型
      if (/[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(chunk)) {
        span.classList.add("chinese");
      }

      line.appendChild(span);
    });
  }

  lyrics.forEach((lyric, index) => {
    const line = document.createElement("div");
    line.className = "lyric-line";
    line.dataset.index = index;

    // 點擊歌詞，讓影片跳到對應時間
line.style.cursor = "pointer";

line.addEventListener("click", () => {
  if (!player || typeof player.seekTo !== "function") {
    return;
  }

  player.seekTo(lyric.time, true);

  // 同步更新歌詞顏色與位置，即使影片暫停也有效
  showLyric(index);
});

    // 新格式：同一句有多種顏色
    if (lyric.parts) {
      lyric.parts.forEach((part) => {
        appendLyricText(
          line,
          part.text,
          part.color || "#3888e8"
        );
      });
    } else {
      // 舊格式：整句使用同一種顏色
      appendLyricText(
        line,
        lyric.text,
        lyric.color || "#3888e8"
      );
    }

    lyricsBox.appendChild(line);
  });
}

function showLyric(index) {
  currentIndex = index;

  const lines = lyricsBox.querySelectorAll(".lyric-line");

  lines.forEach((line, i) => {
    line.classList.toggle(
  "active",
  currentIndex >= 0 && i === currentIndex
);

    const parts = line.querySelectorAll("span");

    parts.forEach((part) => {
    if (currentIndex >= 0 && i <= currentIndex) {
  part.style.color = part.dataset.color;
} else {
  part.style.color = "#aaa3bd";
}
    });
  });

  const activeLine =
  currentIndex >= 0 ? lines[currentIndex] : null;

  if (activeLine) {
    const container = lyricsBox;

    const top =
      activeLine.offsetTop -
      container.offsetTop -
      (container.clientHeight - activeLine.clientHeight) / 2;

    container.scrollTo({
      top: top,
      behavior: "smooth"
    });
  }
}

function syncLyrics() {
  if (
    !player ||
    typeof player.getCurrentTime !== "function" ||
    typeof player.getPlayerState !== "function"
  ) {
    return;
  }

  // 影片暫停或尚未播放時，不更新歌詞
if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
  return;
}

  const time = player.getCurrentTime();

  // 找出目前時間對應的歌詞
  let index = -1;

  for (let i = 0; i < lyrics.length; i++) {
    if (time >= lyrics[i].time) {
      index = i;
    } else {
      break;
    }
  }

  // 歌詞句數改變時更新畫面，倒回第一句前也重設顏色
if (index !== currentIndex) {
  currentIndex = index;
  showLyric(index);
}
}

window.onYouTubeIframeAPIReady = function () {

    playerVars: {

      controls: 1,
      playsinline: 1,

      onReady: function (event) {

          startSeconds: startTime

        timer = setInterval(syncLyrics, 200);

      onError: function (event) {
        lyricsBox.textContent =
          "影片無法播放，錯誤代碼：" + event.data;

  });
};
